name: Android CI

on:
  push:
    branches: [main, develop]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest testDevDebugUnitTest --stacktrace

      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Build prod release (R8 minified, debug-signed in CI)
        run: ./gradlew assembleProdRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fluxpay-apks
          path: android/app/build/outputs/apk/**/*.apk
