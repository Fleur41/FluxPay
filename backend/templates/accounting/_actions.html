<button type="submit" class="font-medium inline-flex items-center gap-1 rounded-default px-3 py-2 bg-primary-600 text-white">Show</button>
{% if csv_url %}<a href="{{ csv_url }}" class="font-medium inline-flex items-center gap-1 rounded-default px-3 py-2 border border-base-200 dark:border-base-700"><span class="material-symbols-outlined">download</span> Excel (CSV)</a>{% endif %}
<button type="button" onclick="window.print()" class="font-medium inline-flex items-center gap-1 rounded-default px-3 py-2 border border-base-200 dark:border-base-700"><span class="material-symbols-outlined">print</span> Print</button>
